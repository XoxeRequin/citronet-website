<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f1861f">
  <meta name="description" content="Citronet — Formulário de Cadastro e Verificação de Viabilidade.">
  <title>Cadastro | Citronet</title>

  <style>
    :root {
      --orange: #f1861f;
      --orange-2: #e85f1e;
      --gold: #f39c2e;
      --dark: #2e3439;
      --muted: #667078;
      --bg: #fafafa;
      --card: rgba(255,255,255,.76);
      --line: rgba(46,52,57,.10);
      --shadow: 0 24px 70px rgba(46,52,57,.12);
      --radius: 26px;
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
                   "Segoe UI", sans-serif;
      color: var(--dark);
      background:
        radial-gradient(circle at 10% 0%, rgba(241,134,31,.13), transparent 30rem),
        radial-gradient(circle at 90% 15%, rgba(243,156,46,.12), transparent 26rem),
        var(--bg);
      overflow-x: hidden;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    a { color: inherit; text-decoration: none; }
    button { font: inherit; }

    /* Ambient animated blobs */
    .orb {
      position: fixed;
      z-index: -1;
      width: 320px;
      height: 320px;
      border-radius: 50%;
      filter: blur(70px);
      opacity: .18;
      pointer-events: none;
      animation: drift 14s ease-in-out infinite alternate;
    }
    .orb.one { background: var(--orange); top: 10%; left: -160px; }
    .orb.two { background: var(--gold); right: -160px; top: 55%; animation-delay: -5s; }

    @keyframes drift {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(70px,35px,0) scale(1.15); }
    }

    .container {
      width: min(1120px, calc(100% - 40px));
      margin: auto;
    }

    nav {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: min(1120px, calc(100% - 28px));
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 14px 10px 18px;
      border: 1px solid rgba(255,255,255,.75);
      background: rgba(255,255,255,.67);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-radius: 18px;
      box-shadow: 0 10px 35px rgba(46,52,57,.08);
    }

    .nav-logo {
      height: 44px;
      width: auto;
      display: block;
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: .92rem;
      font-weight: 650;
      color: #4c555b;
      transition: color .2s ease;
    }
    .back-link:hover { color: var(--orange-2); }

    .nav-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 0;
      border-radius: 999px;
      padding: 11px 18px;
      font-weight: 800;
      font-size: .88rem;
      cursor: pointer;
      color: white;
      background: linear-gradient(135deg, var(--orange), var(--orange-2));
      box-shadow: 0 10px 24px rgba(232,95,30,.23);
      transition: transform .2s ease, box-shadow .2s ease;
    }
    .nav-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 30px rgba(232,95,30,.30);
    }

    main {
      padding-top: 130px;
      padding-bottom: 80px;
      flex: 1;
    }

    .page-head {
      text-align: center;
      margin-bottom: 35px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid rgba(241,134,31,.22);
      background: rgba(241,134,31,.07);
      color: var(--orange-2);
      border-radius: 999px;
      font-weight: 800;
      font-size: .82rem;
      letter-spacing: .01em;
      margin-bottom: 15px;
    }
    .eyebrow::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--orange);
      box-shadow: 0 0 0 5px rgba(241,134,31,.12);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.2rem, 5vw, 3.2rem);
      letter-spacing: -.045em;
    }

    .page-head p {
      max-width: 580px;
      margin: 12px auto 0;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1.02rem;
    }

    .form-card {
      max-width: 760px;
      margin: 0 auto;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.85);
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 24px 16px;
      overflow: hidden;
    }

    .form-card iframe {
      width: 100%;
      height: 2203px;
      border: 0;
      border-radius: 16px;
      display: block;
    }

    footer {
      padding: 45px 0 35px;
      color: var(--muted);
      font-size: .84rem;
      margin-top: auto;
    }
    .footer-inner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      padding-top: 25px;
      border-top: 1px solid var(--line);
    }
    .footer-logo { height: 34px; width: auto; opacity: .9; }

    .whatsapp-float {
      position: fixed;
      right: 22px;
      bottom: 22px;
      z-index: 30;
      width: 57px;
      height: 57px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      color: white;
      background: #20b85a;
      box-shadow: 0 13px 35px rgba(32,184,90,.30);
      transition: transform .2s ease;
    }
    .whatsapp-float:hover { transform: scale(1.08); }
    .whatsapp-float svg { width: 28px; height: 28px; fill: currentColor; }

    @media (max-width: 560px) {
      .container { width: min(100% - 28px, 1120px); }
      nav { top: 9px; }
      .nav-logo { height: 38px; }
      .back-text { display: none; }
      main { padding-top: 110px; }
      .form-card { padding: 12px 6px; border-radius: 20px; }
      .footer-inner { flex-direction: column; text-align: center; }
      .whatsapp-float { right: 16px; bottom: 16px; }
    }
  </style>
</head>
